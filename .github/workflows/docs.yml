name: Deploy docs to GitHub Pages

# Builds the Sphinx documentation (with the interactive numbl examples) and
# publishes it to GitHub Pages. This workflow lives only on the fork used to
# preview the interactive-docs changes; it is not part of an upstream merge.
#
# One-time setup: Settings -> Pages -> "Build and deployment" -> Source ->
# "GitHub Actions" (this repo's workflow enables it via the API).

on:
  push:
    branches: [numbl-interactive-examples]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Build HTML
        run: sphinx-build -b html docs docs/_build/html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
